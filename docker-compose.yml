services:
  # Interactive shell:   docker compose run --rm dev
  # One-off command:     docker compose run --rm dev python evaluation/run_evaluation.py
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mtah2027:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Data mounted read-only on top of the repo, so nothing in the container can modify it.
      - ./data:/workspace/data:ro
    stdin_open: true
    tty: true

  # JupyterLab on http://localhost:8888 :   docker compose up jupyter
  jupyter:
    image: mtah2027:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./data:/workspace/data:ro
    ports:
      - "127.0.0.1:8888:8888"
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.token='' --ServerApp.password=''

  # GPU image (ball detection, video models):   docker compose run --rm gpu <command>
  gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    image: mtah2027-gpu:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./data:/workspace/data:ro
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
